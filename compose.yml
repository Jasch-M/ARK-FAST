services:
    bot:
        container_name: discord-bot
        build:
            context: .
            dockerfile: Dockerfile
            target: prod
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            Startup__Token: ${Startup__Token}
            Startup__DevGuildId: ${Startup__DevGuildId}
            ConnectionStrings__Default: ${ConnectionStrings__Default}

    postgres:
        image: postgres:16.10-alpine3.21
        restart: always
        environment:
            POSTGRES_USER: arkazilla
            POSTGRES_PASSWORD: MrLeCeo5
            POSTGRES_DB: arkazilla
        ports:
            - 5432:5432
        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 10s
            timeout: 5s
            retries: 5
        volumes:
            - pg_data:/var/lib/postgresql/data

volumes:
    pg_data:
